name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PAYSTACK_MOCK: "1"
      EMAIL_DEV_OUTBOX: "1"
      BOOKING_OTP_SECRET: ci-booking-otp-secret-for-tests-only
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      TEST_STAFF_EMAIL: ci-admin@example.test
      TEST_STAFF_PASSWORD: Ci-Staff-Password-123!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env
        run: |
          echo "DATABASE_URL=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.DB_URL)})")" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.API_URL)})")" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.ANON_KEY)})")" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.SERVICE_ROLE_KEY)})")" >> $GITHUB_ENV

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed development data
        run: npm run db:seed

      - name: Ensure CI staff account
        run: node scripts/ensure-ci-staff.mjs

      - name: Fresh migration verification (disposable Supabase on 554xx)
        run: npm run verify:fresh-migration

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Chromium)
        run: npm run test:e2e -- --project=chromium

      - name: Authenticated admin accessibility
        run: npm run test:e2e -- tests/e2e/phase10-admin-axe.spec.ts --project=chromium

      - name: Cross-browser smoke (Firefox + WebKit)
        run: npm run test:e2e -- tests/e2e/cross-browser-smoke.spec.ts --project=firefox --project=webkit

  lighthouse:
    runs-on: ubuntu-latest
    env:
      PAYSTACK_MOCK: "1"
      EMAIL_DEV_OUTBOX: "1"
      BOOKING_OTP_SECRET: ci-booking-otp-secret-for-tests-only
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Export Supabase env
        run: |
          echo "DATABASE_URL=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.DB_URL)})")" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.API_URL)})")" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.ANON_KEY)})")" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);process.stdout.write(j.SERVICE_ROLE_KEY)})")" >> $GITHUB_ENV

      - name: Apply migrations and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Production build
        run: npm run build

      - name: Lighthouse CI
        run: npm run lhci
