<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e4d3c" />
    <title>Connection unavailable | Nii Plants</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        background: #f4f8f5;
        color: #17352b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(90vw, 32rem);
        padding: 2.5rem 2rem;
        text-align: center;
        background: #ffffff;
        border: 1px solid #d6e5dc;
        border-radius: 1rem;
        box-shadow: 0 1rem 3rem rgb(23 53 43 / 10%);
      }

      img {
        width: min(100%, 14rem);
        height: auto;
        margin-bottom: 1.5rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        color: #0e4d3c;
        font-size: clamp(1.7rem, 5vw, 2.25rem);
      }

      p {
        margin: 0 auto 1.5rem;
        line-height: 1.6;
        max-width: 27rem;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      a,
      button {
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.15rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }

      button {
        background: #0e4d3c;
        color: #ffffff;
      }

      a {
        color: #0e4d3c;
        border: 1px solid #a8c7b7;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #e0a83e;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/nii-plants-logo.png" alt="Nii Plants" />
      <h1>Connection unavailable</h1>
      <p>We can’t reach the internet right now. Check your connection and try again.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
        <a href="/">Go home</a>
      </div>
    </main>
  </body>
</html>
